name: Japanese voice integration CI

on:
  pull_request:
  push:
    branches:
      - 'work/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go from module
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: echod/go.mod
          cache-dependency-path: echod/go.sum
      - name: Unit tests
        working-directory: echod
        run: go test ./...
      - name: Build Echo Show ARMv7 daemon (compile-only)
        working-directory: echod
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: go build -trimpath -o ../echod-arm-ci ./cmd/echod
      - name: Verify compiled architecture
        run: file echod-arm-ci
