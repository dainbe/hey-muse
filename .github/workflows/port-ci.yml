name: TECHO5 Muse integration verification
on:
  push:
    branches:
      - integration/techo5-v1.6.26-muse
    paths:
      - '.ci/run-integration'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techo5-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: echod/go.mod
          cache-dependency-path: echod/go.sum
      - name: Compile and run Go tests
        working-directory: echod
        run: go test ./...
      - name: Compile ARMv7 Echo daemon (no install)
        working-directory: echod
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: go build -trimpath -o ../echod-arm-ci ./cmd/echod
      - name: Inspect architecture
        run: file echod-arm-ci
